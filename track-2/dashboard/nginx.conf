server {
  listen 3000;
  location /v1/ {
    proxy_pass http://api:8000;
    # Cold real-data evidence queries can exceed nginx's 60-second default
    # while the decision cache is being populated.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
