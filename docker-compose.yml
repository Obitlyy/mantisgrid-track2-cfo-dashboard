services:
  api:
    build:
      context: ./track-2
      dockerfile: decision/Dockerfile
    command: ["uvicorn", "decision.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
    environment:
      MGAI_DATA_DIR: /app/data
      TRACK2_DATA_DIR: /app/data
      TRACK2_OUTPUT_DIR: /app/out
      TRACK2_AUDIT_MODE: ${TRACK2_AUDIT_MODE:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/health');u.urlopen('http://localhost:8000/v1/decision/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  dashboard:
    build:
      context: ./track-2
      dockerfile: dashboard/Dockerfile
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  prep:
    build: {context: ./track-2, dockerfile: api/Dockerfile.local}
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./track-2/scripts:/app/scripts:ro
      - ./track-2/contracts/official-checksums.txt:/app/official-checksums.txt:ro
    command: ["python", "scripts/prep_data.py"]
    profiles: ["tools"]
  generate:
    build: {context: ./track-2, dockerfile: api/Dockerfile.local}
    working_dir: /app
    volumes: ["./data:/app/data", "./track-2/bin:/app/bin:ro"]
    command: ["sh", "-c", "a=$$(uname -m); case $$a in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; cp bin/mantisgrid-generate-linux-$$a /tmp/gen && chmod +x /tmp/gen && /tmp/gen data"]
    profiles: ["tools"]
  tools:
    build: {context: ./track-2, dockerfile: decision/Dockerfile, target: tools}
    working_dir: /workspace
    volumes: [".:/workspace", "./data:/app/data:ro", "./out:/app/out"]
    environment: {PYTHONPATH: /workspace/track-2, MGAI_DATA_DIR: /app/data, TRACK2_DATA_DIR: /app/data, TRACK2_OUTPUT_DIR: /app/out}
    profiles: ["tools"]
  notebook:
    build: {context: ./track-2, dockerfile: starter/Dockerfile}
    ports: ["127.0.0.1:8888:8888"]
    volumes: ["./track-2/starter:/work", "./data:/app/data:ro"]
    environment: {MGAI_URL: "http://api:8000"}
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=", "--NotebookApp.password="]
    profiles: ["notebook"]
